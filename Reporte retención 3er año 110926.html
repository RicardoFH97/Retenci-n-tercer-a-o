document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:8px 0 10px;cursor:pointer;user-select:none;transition:background .15s;\" style-hover=\"background:#F0EFEC;\">Presentación<\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:16px 24px 12px;margin-bottom:14px;\">\n    <p style=\"font-size:13px;line-height:1.6;color:#1A1A1A;margin:0 0 10px;\">El presente reporte identifica estudiantes, de la cohorte 2024, con riesgos académicos incidentes en su retención de tercer año, que será medida en abril de 2027. Este grupo prioritario debe ser acompañado académica, psicoeducativa y psico afectivamente, de tal modo de que puedan persistir en sus estudios universitarios. El reporte informa, también, sobre la evolución de la retención de 3<sup>er<\u002Fsup> año, la matrícula original de la cohorte 2024 (abril de 2024), su matrícula actual (4ago2026) y la matrícula objetivo (abril 2027).<\u002Fp>\n    \n    <p style=\"font-size:13px;line-height:1.6;color:#1A1A1A;margin:0 0 12px;\">El 3<sup>er<\u002Fsup> año de la trayectoria formativa es parte del ciclo intermedio establecido por el Modelo Educativo institucional. Etapa que profundiza en las áreas de especialidad y en la comprensión de los aspectos esenciales de las disciplinas, con una aproximación progresiva a la indagación y a metodologías propias, junto con el avance hacia el grado académico de licenciado. Fortalecer esto previene la frustración vocacional tardía y consolida el perfil de egreso (<i>Tinto, 2012<\u002Fi>).<\u002Fp>\n    <button type=\"button\" id=\"btnBiblio\" style=\"display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 10px;border-radius:3px;border:1px solid #E2DFDA;background:#F5F4F1;color:#1D1D1D;font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.4;white-space:nowrap;margin-bottom:12px;\" style-hover=\"background:#ECEAE5;\">📚 Acceso a publicaciones de interés<\u002Fbutton><p style=\"font-size:13px;line-height:1.6;color:#1A1A1A;margin:0 0 12px;\">Los estándares de acreditación CNA hacen hincapié, para el nivel de excelencia, sobre el desarrollo de \"… estrategias institucionales de monitoreo de la progresión estudiantil\"; así como la capacidad institucional para mostrar \"evidencias de que sus acciones generan la mejora continua de los indicadores de procesos y resultados de la enseñanza y aprendizaje\". Esto constituye un desafío que la Universidad aborda sistemáticamente.<\u002Fp>\n    <p style=\"font-size:13px;line-height:1.6;color:#1A1A1A;margin:0;\">En este contexto, se invita a revisar el presente reporte y a la activación del protocolo de actuación propuesto.<\u002Fp>\n  <\u002Fdiv>\n\n  <div data-acc=\"header\" style=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:18px 0 10px;cursor:pointer;user-select:none;transition:background .15s;\" style-hover=\"background:#F0EFEC;\">Evolución Retención tercer Año<span style=\"display: block; font-weight: 500; font-size: 12.5px; color: rgb(104, 102, 106); text-transform: none; margin-top: 4px; letter-spacing: 0.2px;\">Periodo: 2018 (cohorte 2015) a 2026 (cohorte 2023)<\u002Fspan><\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:8px;padding:12px 16px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px;\">\n    <div style=\"display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1;\">\n      <label for=\"fCampus\" style=\"font-size:11px;font-weight:600;color:#68666A;text-transform:uppercase;letter-spacing:0.5px;\">Campus<\u002Flabel>\n      <sc-raw-select id=\"fCampus\" style=\"padding:8px 10px;border:1px solid #E2DFDA;border-radius:6px;font-size:13px;color:#1A1A1A;background:#fff;font-family:inherit;\"><option value=\"\">Todos (Corporativo)<\u002Foption><\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1;\">\n      <label for=\"fFacultad\" style=\"font-size:11px;font-weight:600;color:#68666A;text-transform:uppercase;letter-spacing:0.5px;\">Facultad<\u002Flabel>\n      <sc-raw-select id=\"fFacultad\" style=\"padding:8px 10px;border:1px solid #E2DFDA;border-radius:6px;font-size:13px;color:#1A1A1A;background:#fff;font-family:inherit;\"><option value=\"\">Todas<\u002Foption><\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1;\">\n      <label for=\"fCarrera\" style=\"font-size:11px;font-weight:600;color:#68666A;text-transform:uppercase;letter-spacing:0.5px;\">Carrera<\u002Flabel>\n      <sc-raw-select id=\"fCarrera\" style=\"padding:8px 10px;border:1px solid #E2DFDA;border-radius:6px;font-size:13px;color:#1A1A1A;background:#fff;font-family:inherit;\"><option value=\"\">Todas<\u002Foption><\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1;\">\n      <label for=\"fJornada\" style=\"font-size:11px;font-weight:600;color:#68666A;text-transform:uppercase;letter-spacing:0.5px;\">Jornada<\u002Flabel>\n      <sc-raw-select id=\"fJornada\" style=\"padding:8px 10px;border:1px solid #E2DFDA;border-radius:6px;font-size:13px;color:#1A1A1A;background:#fff;font-family:inherit;\"><option value=\"\">Todas<\u002Foption><\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <button id=\"btnClear\" style=\"padding:9px 16px;border-radius:4px;border:1px solid #1D1D1D;background:#fff;color:#1D1D1D;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;\" style-hover=\"background:#F0EFEC;\">✕ Limpiar filtros<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div id=\"activeScope\" style=\"font-size:12.5px;color:#68666A;margin:-4px 0 12px 2px;\">Mostrando: <b>Corporativo<\u002Fb> (todas las facultades, campus y carreras)<\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:16px 24px 12px;margin-bottom:14px;\">\n    <h2 style=\"font-size:16px;margin:0 0 2px;font-weight:800;letter-spacing:-0.1px;\">Evolución Retención 3er Año<\u002Fh2>\n    <p id=\"evoDesc\" style=\"font-size:12.5px;color:#68666A;margin:0 0 12px;\">Serie histórica por cohorte de ingreso, medida en el año correspondiente al 3er año de progresión.<\u002Fp>\n    <div style=\"position:relative;height:340px;\"><canvas id=\"chartEvo\"><\u002Fcanvas><\u002Fdiv>\n    <div style=\"font-size:10.5px;color:#8B94A0;margin-top:10px;text-align:right;\">Fuente: PBI DAI-VRAC (23jul2026)<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-acc=\"header\" style=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:18px 0 10px;cursor:pointer;user-select:none;transition:background .15s;\" style-hover=\"background:#F0EFEC;\">Factores de Riesgo Académico<\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:16px 24px 12px;margin-bottom:14px;\">\n    <p style=\"font-size:13px;line-height:1.5;color:#1A1A1A;margin-bottom:10px;\">Los factores de riesgo académico considerados, para la cohorte 2024, son la efectividad y el rendimiento. El primero se midió con la efectividad en el avance curricular (EAC), es decir, la tasa de aprobación de créditos inscritos; en tanto, el rendimiento se midió&nbsp; con la nota promedio del último periodo académico cursado.<\u002Fp>\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-bottom:10px;\">\n      <div style=\"flex:1;min-width:260px;background:#F7F6F4;border:1px solid #E2DFDA;border-radius:6px;padding:10px 16px;\">\n        <b style=\"font-size:12.5px;color:#B01319;\">Efectividad en el Avance Curricular (EAC) al 31 de dic. 2025<\u002Fb>\n        <div style=\"font-size:13px;color:#68666A;margin-top:4px;\">N° de créditos aprobados / N° de créditos inscritos<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:260px;background:#F7F6F4;border:1px solid #E2DFDA;border-radius:6px;padding:10px 16px;\">\n        <b style=\"font-size:12.5px;color:#B01319;\">Promedio General último semestre<\u002Fb>\n        <div style=\"font-size:13px;color:#68666A;margin-top:4px;\">Escala 1,0 – 7,0<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#1D1D1D;color:#fff;font-size:12px;font-weight:700;letter-spacing:0.4px;padding:7px 14px;border-radius:5px 5px 0 0;\">GRUPOS DE RIESGO ACADÉMICO<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;border:1px solid #E2DFDA;border-top:none;border-radius:0 0 5px 5px;overflow:hidden;margin-bottom:16px;\">\n      <div style=\"padding:10px 16px;border-right:1px solid #E2DFDA;border-bottom:1px solid #E2DFDA;display:flex;align-items:center;gap:10px;\">\n        <span style=\"width:12px;height:12px;border-radius:50%;background:#2E7D5B;flex-shrink:0;\"><\u002Fspan>\n        <div><b style=\"font-size:13px;\">Riesgo \"Bajo\"<\u002Fb><div style=\"font-size:12px;color:#68666A;\">EAC ≥ 50% y Promedio ≥ 4,0<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:10px 16px;border-bottom:1px solid #E2DFDA;display:flex;align-items:center;gap:10px;\">\n        <span style=\"width:12px;height:12px;border-radius:50%;background:#4A7FB5;flex-shrink:0;\"><\u002Fspan>\n        <div><b style=\"font-size:13px;\">Riesgo \"Medio Bajo\"<\u002Fb><div style=\"font-size:12px;color:#68666A;\">EAC ≥ 50% y Promedio &lt; 4,0<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:10px 16px;border-right:1px solid #E2DFDA;display:flex;align-items:center;gap:10px;\">\n        <span style=\"width:12px;height:12px;border-radius:50%;background:#E8A33D;flex-shrink:0;\"><\u002Fspan>\n        <div><b style=\"font-size:13px;\">Riesgo \"Medio Alto\"<\u002Fb><div style=\"font-size:12px;color:#68666A;\">EAC &lt; 50% y Promedio ≥ 4,0<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:10px 16px;display:flex;align-items:center;gap:10px;\">\n        <span style=\"width:12px;height:12px;border-radius:50%;background:#B23A3A;flex-shrink:0;\"><\u002Fspan>\n        <div><b style=\"font-size:13px;\">Riesgo \"Alto\"<\u002Fb><div style=\"font-size:12px;color:#68666A;\">EAC &lt; 50% y Promedio General &lt; 4,0<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:10.5px;color:#8B94A0;text-align:left;margin:-10px 0 16px;\">Nota: los 4 grupos son mutuamente excluyentes — cruzan el corte de Efectividad de Avance Curricular (50%) con el corte de Promedio General (4,0). Cada estudiante pertenece exactamente a uno de los cuatro.<\u002Fdiv>\n\n    <p style=\"font-size:12.5px;color:#68666A;margin:0 0 10px;\">Filtra aquí para estimar los grupos de riesgo.<\u002Fp>\n    <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:8px;padding:12px 16px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px;\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1;\">\n        <label for=\"fCampus2\" style=\"font-size:11px;font-weight:600;color:#68666A;text-transform:uppercase;letter-spacing:0.5px;\">Campus<\u002Flabel>\n        <sc-raw-select id=\"fCampus2\" style=\"padding:8px 10px;border:1px solid #E2DFDA;border-radius:6px;font-size:13px;color:#1A1A1A;background:#fff;font-family:inherit;\"><option value=\"\">Todos (Corporativo)<\u002Foption><\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1;\">\n        <label for=\"fFacultad2\" style=\"font-size:11px;font-weight:600;color:#68666A;text-transform:uppercase;letter-spacing:0.5px;\">Facultad<\u002Flabel>\n        <sc-raw-select id=\"fFacultad2\" style=\"padding:8px 10px;border:1px solid #E2DFDA;border-radius:6px;font-size:13px;color:#1A1A1A;background:#fff;font-family:inherit;\"><option value=\"\">Todas<\u002Foption><\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1;\">\n        <label for=\"fCarrera2\" style=\"font-size:11px;font-weight:600;color:#68666A;text-transform:uppercase;letter-spacing:0.5px;\">Carrera<\u002Flabel>\n        <sc-raw-select id=\"fCarrera2\" style=\"padding:8px 10px;border:1px solid #E2DFDA;border-radius:6px;font-size:13px;color:#1A1A1A;background:#fff;font-family:inherit;\"><option value=\"\">Todas<\u002Foption><\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1;\">\n        <label for=\"fJornada2\" style=\"font-size:11px;font-weight:600;color:#68666A;text-transform:uppercase;letter-spacing:0.5px;\">Jornada<\u002Flabel>\n        <sc-raw-select id=\"fJornada2\" style=\"padding:8px 10px;border:1px solid #E2DFDA;border-radius:6px;font-size:13px;color:#1A1A1A;background:#fff;font-family:inherit;\"><option value=\"\">Todas<\u002Foption><\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <button id=\"btnClear2\" style=\"padding:9px 16px;border-radius:4px;border:1px solid #1D1D1D;background:#fff;color:#1D1D1D;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;\" style-hover=\"background:#F0EFEC;\">✕ Limpiar filtros<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div id=\"activeScope2\" style=\"font-size:12.5px;color:#68666A;margin:-4px 0 12px 2px;\">Mostrando: <b>Corporativo<\u002Fb> (todas las facultades, campus, carreras y jornadas) — usa los filtros de arriba, se aplican también aquí<\u002Fdiv>\n\n    <div id=\"riskKpiRow\" style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px;\"><\u002Fdiv>\n\n    <h2 style=\"font-size:16px;margin-top:6px;margin-bottom:4px;font-weight:800;letter-spacing:-0.1px;\">Gráfico de dispersión de los grupos de riesgo<\u002Fh2>\n    <p id=\"riesgoDesc\" style=\"font-size:12.5px;color:#68666A;margin:0 0 12px;\">Cada punto es un estudiante activo de la cohorte 2024 cuya ubicación en la gráfica depende de s eg-k4-pct\" style=\"font-size:12px;font-weight:600;color:#4A5568;margin-top:4px;\">43,8%<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border-top:2px solid #1A1A1A;padding-top:10px;margin:0 0 12px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;\">\n      <div style=\"flex:1;min-width:260px;\">\n        <h2 style=\"font-size:15px;margin:0;font-weight:800;letter-spacing:-0.1px;color:#1A1A1A;\">Dispersión de migración: avance curricular y promedio del segundo período<\u002Fh2>\n        <p style=\"font-size:12px;color:#68666A;margin:4px 0 0;\">Cada punto representa un estudiante del grupo de riesgo Alto. La línea de corte en promedio 4,0 separa a quienes migran a riesgo Medio Alto de quienes permanecen en riesgo Alto; los casos sin nota registrada se agrupan en la franja base.<\u002Fp>\n        <div title=\"Criterio Eje Y (Promedio): Cohorte 202410 = Promedio regular 1° período 202620 | Cohorte 202431 = Promedio acumulado período 202632.\" style=\"display:flex;align-items:flex-start;gap:8px;margin-top:8px;padding:8px 12px;background:#F7F6F4;border-left:3px solid #4A5568;border-radius:0 4px 4px 0;cursor:help;\">\n          <span aria-hidden=\"true\" style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#4A5568;color:#fff;font-size:11px;font-weight:700;line-height:16px;text-align:center;font-style:italic;\">i<\u002Fspan>\n          <span style=\"font-size:11.5px;line-height:1.5;color:#4A5568;\"><b style=\"color:#1A1A1A;\">Criterio Eje Y (Promedio):<\u002Fb> Cohorte 202410 = Promedio regular 1° período 202620 | Cohorte 202431 = Promedio acumulado período 202632.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button id=\"btnSegReplay\" style=\"padding:9px 16px;border-radius:4px;border:1px solid #1D1D1D;background:#fff;color:#1D1D1D;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;flex:none;\" style-hover=\"background:#F0EFEC;\">▶ Replicar movimiento<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"height:420px;position:relative;z-index:1;\">\n      <canvas id=\"chartSeguimiento\"><\u002Fcanvas>\n      <div title=\"Criterio Eje Y (Promedio): Cohorte 202410 = Promedio regular 1° período 202620 | Cohorte 202431 = Promedio acumulado período 202632.\" style=\"position:absolute;left:0;top:25%;width:24px;height:50%;cursor:help;\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-size:10.5px;line-height:1.6;color:#666666;margin-top:14px;\">Nota metodológica 1: La migración se determina exclusivamente por el promedio general obtenido en el segundo período. Los estudiantes sin nota registrada se reportan por separado y no se imputan a ninguna categoría de riesgo.<\u002Fdiv>\n    <div style=\"font-size:10.5px;line-height:1.6;color:#666666;margin-top:4px;\">Nota metodológica 2: La Efectividad en Avance Curricular corresponde al corte de conformación del grupo de riesgo, condición por la cual la totalidad de los casos se ubica bajo el 50%. El emparejamiento entre avance curricular y promedio del segundo período se realiza a nivel de campus y jornada, por lo que la lectura de la dispersión es válida a nivel agregado y no a nivel de caso individual.<\u002Fdiv>\n    <div style=\"font-size:10.5px;color:#8B94A0;margin-top:12px;text-align:right;\">Elaboración DCA-VRAC. Fuente: registro académico de promedios al 10 de septiembre de 2026, grupo de riesgo cohorte 2024.<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:24px 40px 40px;box-sizing:border-box;border-top:1px solid #E2DFDA;text-align:center;\">\n  <span style=\"font-size:11px;letter-spacing:1.2px;color:#68666A;text-transform:uppercase;font-weight:700;\">Universidad Autónoma de Chile · Dirección de Calidad de los Aprendizajes - Vicerrectoría Académica<\u002Fspan>\n<\u002Fdiv>\n\n<div id=\"biblioOverlay\" style=\"display:none;position:fixed;inset:0;background:rgba(31,41,55,0.55);align-items:center;justify-content:center;padding:24px;z-index
